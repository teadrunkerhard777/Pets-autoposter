name: Pets Autoposter

# Manual runs are safe by default. A trusted external scheduler can explicitly
# request publication through the same workflow_dispatch endpoint.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Send selected posts to Telegram"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# A later run waits instead of interrupting a publisher with unknown state.
concurrency:
  group: pets-autoposter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run autoposter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOPOSTER_DRY_RUN: ${{ inputs.publish && 'false' || 'true' }}
        run: python main.py

      - name: Commit publication history
        if: ${{ success() && inputs.publish }}
        shell: bash
        run: |
          if git diff --quiet -- storage/published.json; then
            echo "Publication history did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/published.json
          git commit -m "Update publication history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
