name: Pets Video Autoposter

on:
  schedule:
    # 13:00 and 20:00 in Asia/Yekaterinburg (UTC+5).
    - cron: "0 8 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Send one selected video to Telegram"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pets-autoposter
  cancel-in-progress: false

jobs:
  publish-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Select and publish one video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOPOSTER_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.publish) && 'false' || 'true' }}
        run: python video_main.py

      - name: Commit publication history
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish) }}
        shell: bash
        run: |
          if git diff --quiet -- storage/published.json; then
            echo "Publication history did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/published.json
          git commit -m "Update publication history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
